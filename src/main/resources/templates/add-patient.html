<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Patient - Hospital Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f4f8fc, #eaf3f8);
            color: #1e293b;
        }

        /* ================= HEADER ================= */

        header {
            background: linear-gradient(135deg, #12344d, #176b87);
            color: white;
            padding: 28px 7%;
            box-shadow: 0 4px 18px rgba(15, 45, 65, 0.18);
        }

        .header-content {
            max-width: 900px;
            margin: auto;
        }

        header h1 {
            font-size: 31px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        header p {
            font-size: 16px;
            color: #dbeaf1;
        }

        /* ================= CONTAINER ================= */

        .container {
            width: 90%;
            max-width: 720px;
            margin: 42px auto;
        }

        .card {
            background: rgba(255, 255, 255, 0.97);
            padding: 38px;
            border-radius: 18px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 30px rgba(15, 45, 65, 0.08);
        }

        /* ================= TITLE ================= */

        .title-area {
            text-align: center;
            margin-bottom: 32px;
        }

        .title-icon {
            width: 58px;
            height: 58px;

            margin: 0 auto 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #e8f5f8;
            border-radius: 16px;

            color: #126782;
            font-size: 28px;

            box-shadow: inset 0 0 0 1px #d4ebf0;
        }

        h2 {
            color: #164e63;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .subtitle {
            color: #64748b;
            font-size: 15px;
        }

        /* ================= FORM ================= */

        .form-group {
            margin-bottom: 21px;
        }

        label {
            display: block;
            margin-bottom: 8px;

            font-size: 14px;
            font-weight: 600;
            color: #334155;
        }

        input,
        select {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #cbd5e1;
            border-radius: 9px;

            background: #ffffff;

            color: #1e293b;
            font-size: 15px;

            outline: none;

            transition: border-color 0.2s ease,
                        box-shadow 0.2s ease;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:focus,
        select:focus {
            border-color: #167d99;
            box-shadow: 0 0 0 3px rgba(22, 125, 153, 0.10);
        }

        select {
            cursor: pointer;
        }

        /* ================= BUTTONS ================= */

        .buttons {
            display: flex;
            gap: 14px;
            margin-top: 30px;
        }

        button,
        .back-btn {
            flex: 1;

            padding: 13px 20px;

            border: none;
            border-radius: 9px;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;
            text-decoration: none;
            text-align: center;

            transition: all 0.2s ease;
        }

        button {
            background: #167d99;
            color: white;
        }

        button:hover {
            background: #105f76;
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(22, 125, 153, 0.22);
        }

        .back-btn {
            background: #64748b;
            color: white;
        }

        .back-btn:hover {
            background: #475569;
            transform: translateY(-1px);
        }

        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            header {
                padding: 24px 20px;
            }

            header h1 {
                font-size: 25px;
            }

            header p {
                font-size: 14px;
            }

            .container {
                width: 94%;
                margin: 30px auto;
            }

            .card {
                padding: 27px 22px;
                border-radius: 16px;
            }

            h2 {
                font-size: 25px;
            }

            .buttons {
                flex-direction: column;
            }

            button,
            .back-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-content">
        <h1>Hospital Management System</h1>
        <p>Patient Management</p>
    </div>
</header>

<div class="container">

    <div class="card">

        <div class="title-area">

            <div class="title-icon">
                +
            </div>

            <h2>Add New Patient</h2>

            <p class="subtitle">
                Enter patient details to create a new record.
            </p>

        </div>

        <form th:action="@{/patients/add}"
              th:object="${patient}"
              method="post">

            <div class="form-group">

                <label for="name">
                    Patient Name
                </label>

                <input type="text"
                       id="name"
                       th:field="*{name}"
                       placeholder="Enter patient name"
                       required>

            </div>


            <div class="form-group">

                <label for="age">
                    Age
                </label>

                <input type="number"
                       id="age"
                       th:field="*{age}"
                       placeholder="Enter age"
                       min="1"
                       max="120"
                       required>

            </div>


            <div class="form-group">

                <label for="gender">
                    Gender
                </label>

                <select id="gender"
                        th:field="*{gender}"
                        required>

                    <option value="">
                        Select Gender
                    </option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="disease">
                    Disease
                </label>

                <input type="text"
                       id="disease"
                       th:field="*{disease}"
                       placeholder="Enter disease"
                       required>

            </div>


            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input type="tel"
                       id="phone"
                       th:field="*{phone}"
                       placeholder="Enter 10-digit phone number"
                       maxlength="10"
                       pattern="[0-9]{10}"
                       required>

            </div>


            <div class="buttons">

                <button type="submit">
                    Add Patient
                </button>

                <a href="/patients"
                   class="back-btn">
                    ← Back
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
