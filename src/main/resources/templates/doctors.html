<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doctors - Hospital Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f4f8fc, #eaf3f8);
            color: #1e293b;
        }

        /* ================= HEADER ================= */

        header {
            background: linear-gradient(135deg, #12344d, #176b87);
            color: white;
            padding: 28px 7%;
            box-shadow: 0 4px 18px rgba(15, 45, 65, 0.18);
        }

        .header-content {
            max-width: 1200px;
            margin: auto;
        }

        header h1 {
            font-size: 31px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        header p {
            font-size: 16px;
            color: #dbeaf1;
        }

        /* ================= CONTAINER ================= */

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 42px auto;
        }

        .card {
            background: rgba(255, 255, 255, 0.97);
            padding: 32px;
            border-radius: 18px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 30px rgba(15, 45, 65, 0.08);
        }

        /* ================= TOP SECTION ================= */

        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            gap: 20px;
        }

        .title-area {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .title-icon {
            width: 52px;
            height: 52px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #e8f5f8;
            border-radius: 14px;

            color: #126782;
            font-size: 28px;

            box-shadow: inset 0 0 0 1px #d4ebf0;
        }

        .top-section h2 {
            color: #164e63;
            font-size: 28px;
            font-weight: 700;
        }

        /* ================= ADD BUTTON ================= */

        .add-btn {
            display: inline-block;

            background: #167d99;
            color: white;

            text-decoration: none;
            padding: 13px 21px;

            border-radius: 9px;

            font-weight: 600;
            font-size: 15px;

            transition: all 0.2s ease;
        }

        .add-btn:hover {
            background: #105f76;
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(22, 125, 153, 0.22);
        }

        /* ================= TABLE ================= */

        .table-wrapper {
            overflow-x: auto;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th {
            background: #164e63;
            color: white;

            padding: 15px 16px;
            text-align: left;

            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        td {
            padding: 15px 16px;

            border-bottom: 1px solid #e2e8f0;

            font-size: 15px;
            color: #334155;
        }

        tbody tr {
            transition: background 0.15s ease;
        }

        tbody tr:hover {
            background: #f1f8fa;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        /* ================= EMPTY ================= */

        .empty {
            text-align: center;
            padding: 40px !important;
            color: #64748b;
            font-size: 16px;
        }

        /* ================= BACK BUTTON ================= */

        .back {
            display: inline-block;

            margin-top: 26px;

            background: #64748b;
            color: white;

            text-decoration: none;

            padding: 12px 20px;
            border-radius: 9px;

            font-weight: 600;
            font-size: 15px;

            transition: all 0.2s ease;
        }

        .back:hover {
            background: #475569;
            transform: translateY(-1px);
        }

        /* ================= MOBILE ================= */

        @media (max-width: 700px) {

            header {
                padding: 24px 6%;
            }

            header h1 {
                font-size: 25px;
            }

            header p {
                font-size: 14px;
            }

            .container {
                width: 94%;
                margin: 30px auto;
            }

            .card {
                padding: 22px;
                border-radius: 16px;
            }

            .top-section {
                flex-direction: column;
                align-items: stretch;
            }

            .title-area {
                justify-content: flex-start;
            }

            .top-section h2 {
                font-size: 25px;
            }

            .add-btn {
                width: 100%;
                text-align: center;
            }

            .back {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-content">
        <h1>Hospital Management System</h1>
        <p>Doctor Management</p>
    </div>
</header>

<div class="container">

    <div class="card">

        <div class="top-section">

            <div class="title-area">

                <div class="title-icon">
                    ⚕
                </div>

                <h2>Doctors</h2>

            </div>

            <a href="/doctors/add" class="add-btn">
                + Add Doctor
            </a>

        </div>

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>Doctor ID</th>
                        <th>Name</th>
                        <th>Specialization</th>
                        <th>Phone</th>
                        <th>Email</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="doctor : ${doctors}">

                        <td th:text="${doctor.id}"></td>

                        <td th:text="${doctor.name}"></td>

                        <td th:text="${doctor.specialization}"></td>

                        <td th:text="${doctor.phone}"></td>

                        <td th:text="${doctor.email}"></td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(doctors)}">

                        <td colspan="5" class="empty">
                            No doctors found.
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

        <a href="/" class="back">
            ← Back to Dashboard
        </a>

    </div>

</div>

</body>
</html>
